{% set name = "opengbsa" %}
{% set version = "0.0.8" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ..

build:
  number: 0
  entry_points:
    - opengbsa = mmgbsa.cli:main
  script: |
    bash "{{ RECIPE_DIR }}/install_tprparser.sh" || true
    python -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - numpy >=1.21.0,<2.0.0
  run:
    - python
    - openmm ==8.5.0beta
    - mdtraj >=1.9.0
    - openff-toolkit >=0.14.0
    - openmmforcefields
    - prolif >=2.0.0
    - rdkit
    - mdanalysis
    - numpy >=1.21.0,<2.0.0
    - scipy >=1.7.0
    - pandas >=1.3.0
    - matplotlib >=3.5.0
    - seaborn >=0.11.0
    - pyyaml >=6.0
    - pathlib2 >=2.3.0
    - plotly >=5.0.0

test:
  commands:
    - opengbsa --help
    - opengbsa --version
    - python -c "from mmgbsa._version import __version__; assert __version__ == '{{ version }}'"
  imports:
    - mmgbsa

about:
  home: "https://github.com/Bio-Otto/opengbsa"
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES.md
  summary: "OpenGBSA - A comprehensive MM/GBSA analysis package with advanced features"
  description: |
    OpenGBSA is a comprehensive and automated tool for Binding Free Energy,
    Energy Decomposition, and Entropy calculations for protein-ligand
    complexes derived from molecular dynamics simulations. Supports GROMACS
    (.tpr, .top, .gro), Amber (.prmtop), and raw PDB + trajectory inputs.

    Note: native GROMACS .tpr support is provided by an optional, vendored
    GPLv3-licensed component (TprParser), installed automatically when a
    matching wheel is bundled for your platform/Python version -- see
    THIRD_PARTY_LICENSES.md. Every other input format and feature works
    without it.

  dev_url: "https://github.com/Bio-Otto/opengbsa"
  doc_url: "https://opengbsa.readthedocs.io/"

extra:
  recipe-maintainers:
    - Bio-Otto
