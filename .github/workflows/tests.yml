name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: opengbsa-ci
          create-args: >-
            -c conda-forge/label/openmm_rc -c conda-forge
            python=${{ matrix.python-version }}
            openmm=8.5.0beta
            mdtraj>=1.9.0
            openff-toolkit>=0.14.0
            openmmforcefields
            prolif>=2.0.0
            rdkit
            mdanalysis
            numpy>=1.21.0,<2.0.0
            scipy>=1.7.0
            pandas>=1.3.0
            matplotlib>=3.5.0
            seaborn>=0.11.0
            pyyaml>=6.0
            plotly>=5.0.0
            pathlib2
            pytest
          init-shell: bash

      - name: Install opengbsa (no deps)
        shell: bash -el {0}
        run: pip install --no-deps -e .

      - name: Import sanity check
        shell: bash -el {0}
        run: |
          python -c "import mmgbsa; from mmgbsa.mmgbsa_core import GBSACalculator; print('import OK')"
          python -m compileall -q mmgbsa/

      - name: CLI sanity check
        shell: bash -el {0}
        run: |
          opengbsa --version
          opengbsa --help

      - name: Run test suite
        shell: bash -el {0}
        run: python -m pytest test/unit -v

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install docs dependencies
        run: pip install -r requirements.txt

      - name: Build Sphinx docs
        run: sphinx-build -b html -W docs/source docs/_build/html
