name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge/label/openmm_rc,conda-forge
          channel-priority: strict
          conda-remove-defaults: true
          activate-environment: opengbsa-ci

      - name: Install conda dependencies
        shell: bash -el {0}
        run: |
          mamba install -y -n opengbsa-ci \
            "openmm=8.5.0beta" \
            "mdtraj>=1.9.0" \
            "openff-toolkit>=0.14.0" \
            openmmforcefields \
            "prolif>=2.0.0" \
            rdkit \
            mdanalysis \
            "numpy>=1.21.0,<2.0.0" \
            "scipy>=1.7.0" \
            "pandas>=1.3.0" \
            "h5py>=3.7.0" \
            "matplotlib>=3.5.0" \
            "seaborn>=0.11.0" \
            "pyyaml>=6.0" \
            "plotly>=5.0.0" \
            pathlib2 \
            pytest

      - name: Install opengbsa (no deps)
        shell: bash -el {0}
        run: pip install --no-deps -e .

      - name: Import sanity check
        shell: bash -el {0}
        run: |
          python -c "import mmgbsa; from mmgbsa.mmgbsa_core import GBSACalculator; print('import OK')"
          python -m compileall -q mmgbsa/

      - name: CLI sanity check
        shell: bash -el {0}
        run: |
          opengbsa --version
          opengbsa --help

      - name: Run test suite
        shell: bash -el {0}
        run: python -m pytest test/unit -v

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install docs dependencies
        run: pip install -r requirements.txt

      - name: Build Sphinx docs
        run: sphinx-build -b html -W docs/source docs/_build/html
