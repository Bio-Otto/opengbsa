# MM/GBSA Analysis Configuration for 7khz (Gromacs Input Test)
# Tests regression on Gromacs format support and recent fixes

config_file: "test/configs/7khz_gro_config.yaml"

input_files:
  # Topology (Coordinate + Topo information for Gromacs .gro is treated as PDB-like structure source)
  # USING .top FOR NATIVE MODE (System Definition)
  complex_pdb: "/home/bio-otto/Desktop/opengbsa/test/data/7khz_gro_test/topol.top"
  # Trajectory
  trajectory: "/home/bio-otto/Desktop/opengbsa/test/data/7khz_gro_test/md_complex_full.xtc"
  # Explicit Topology (Defines the forcefield and system parameters)
  # IMPORTANT for Gromacs: This file should include necessary .itp files or they should be findable
  solvated_topology: "/home/bio-otto/Desktop/opengbsa/test/data/7khz_gro_test/topol.top"
  
  ligand_resname: "LIG"

output_settings:
  output_directory: "test/results/7khz_gro_test"
  analysis_name: "7khz_gro_test"
  
analysis_settings:
  method: "mmgbsa"
  max_frames: 50 # approx (endframe=1000 / interval=5)
  frame_stride: 5 # User specified interval=5
  frame_selection: sequential
  use_cache: false
  verbose: true

  # Physics Parameters
  salt_concentration: 0.15
  solute_dielectric: 1.0
  solvent_dielectric: 78.5
  
  # GB Model (default is OBC2)
  gb_model: "OBC2"
  # SA Model (matching 6t1h fix)
  sa_model: "LCPO"
  
  # Entropy (Fast method for testing)
  entropy_method: "interaction"
  
  # Parallelism
  n_jobs: -1

advanced_settings:
  # Skip potentially problematic auto-conversion if we provide explicit files
  force_gromacs_conversion: false
  run_per_residue_decomposition: true
  decomp_frames: 200
  print_interval: 10
