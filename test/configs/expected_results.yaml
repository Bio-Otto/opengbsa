# Expected mean binding enthalpies (kcal/mol) of the validation cases, read by
# check_validation.py. opengbsa_defaults: OpenGBSA at its default settings with the
# configuration in this folder. mmpbsa: Amber MMPBSA.py on the same frames, the
# reference for a run with amber_compatible: true. Values from the OpenGBSA paper's
# validation (Additional file 1, Tables S1 and S3), computed on a CUDA GPU.
# check_validation.py therefore runs on CUDA unless told otherwise.
# download: size of that folder's fetch_data.sh download (*: one archive for all
# seven 3CLpro ligands; the VRC01 size is per variant). prepare: the commands that
# download and prepare the inputs, run in the case folder.

3dd2:
  folder: rna_protein_test
  config: 3dd2_config.yaml
  prepare: "./fetch_data.sh && python prepare_system.py"
  description: protein-RNA, Amber .prmtop (Native Mode)
  frames: 300
  download: 44 MB
  opengbsa_defaults: -16.575
  mmpbsa: -23.493
  tolerance: 0.02

irf11:
  folder: dna_protein_test
  config: irf11_dna_config.yaml
  prepare: "./fetch_data.sh && python prepare_system.py"
  description: protein-DNA, multi-model PDB (Coordinate Mode)
  frames: 101
  download: 25 MB
  opengbsa_defaults: -103.845
  mmpbsa: -109.623
  tolerance: 0.05
  note_amber_compatible: OpenMM's Coulomb constant is 3.5e-5 larger than Amber's; on this complex the electrostatic term (-7,225 kcal/mol) moves by -0.25 and the polar term (+7,220 kcal/mol) by +0.22, which leaves -0.024 kcal/mol

