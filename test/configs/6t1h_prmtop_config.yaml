input_files:
  # In Native Mode (PRMTOP), complex_pdb points to the prmtop file
  complex_pdb: test/data/6t1h_prmtop_test/complex.prmtop
  # Ligand prmtop/pdb might be useful but main driver is complex.prmtop
  trajectory: test/data/6t1h_prmtop_test/md_complex_prod.xtc
  # Solvated topology needed for XTC loading
  solvated_topology: test/data/6t1h_prmtop_test/replica_1/gro/complex_solv_ions.gro
  # Explicit topologies (Native Mode Optimization)
  receptor_topology: test/data/6t1h_prmtop_test/receptor.prmtop
  ligand_topology: test/data/6t1h_prmtop_test/ligand.prmtop

output_settings:
  output_directory: test/results/6t1h_prmtop_analysis
  analysis_name: 6t1h_prmtop_test
  save_plots: true
  save_logs: true

analysis_settings:
  temperature: 300.0
  gb_model: GBn  # Match Amber igb=5
  salt_concentration: 0.15
  decomposition_frames: 200  # Match Amber: 1000 frames / 5 stride = 200 frames
  frame_start: 0
  frame_end: 1000
  frame_stride: 5 
  max_frames: 200  # For main MM/GBSA calculation
  frame_selection: sequential
  use_cache: true
  verbose: 1
  # Native mode supports entropy via NMODE if structure allows, but sticking to basics first
  entropy_method: none 
  run_entropy_analysis: false
  run_per_residue_decomposition: true
  report_raw_energies: true
  decomp_frames: 200  # Full decomposition to match Amber
  sa_model: LCPO # Match AmberTools default/user output

forcefield_settings:
  protein_forcefield: amber # Default for PRMTOP usually
