analysis_settings:
  decomp_frames: 10
  entropy_method: none
  frame_selection: sequential
  frame_stride: 1
  gb_model: GBn
  max_frames: 10
  report_raw_energies: false
  run_entropy_analysis: false
  run_per_residue_decomposition: true
  sa_model: ACE
  salt_concentration: 0.15
  temperature: 300.0
  use_cache: false
  verbose: 1
  receptor_selection: chainid 0
  ligand_selection: resname UNL
  parallel_processing: true
forcefield_settings:
  protein_forcefield: amber
input_files:
  complex_pdb: test/data/3if6_dimer_test/3if6.tpr
  trajectory: test/data/3if6_dimer_test/3if6.xtc
output_settings:
  analysis_name: test_tpr_custom
  output_directory: test/results/comprehensive/test_tpr_custom
  save_logs: true
  save_plots: false
platform_settings:
  decomposition_platform: CPU
  preferred_platform: OpenCL
