input_files:
  ligand_mol: test/data/3if6_dimer_test/ligand.sdf
  complex_pdb: test/data/3if6_dimer_test/3if6.tpr
  trajectory: test/data/3if6_dimer_test/3if6.xtc
  ligand_resname: LIG

analysis_settings:
  temperature: 300.0
  gb_model: OBC2
  salt_concentration: 0.15
  max_frames: 10
  frame_start: null
  frame_end: null
  frame_stride: 1
  frame_selection: sequential
  random_seed: 42
  verbose: 1
  use_cache: true
  parallel_processing: true
  energy_decomposition: true
  run_entropy_analysis: false
  run_per_residue_decomposition: true
  decomp_frames: 10

output_settings:
  output_directory: test/results/frame_test_configs
  save_plots: true
  save_logs: true

platform_settings:
  preferred_platform: CUDA
  decomposition_platform: CPU
