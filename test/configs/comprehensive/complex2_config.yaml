input_files:
  ligand_mol: test/data/6xj3_pdb_test/ligand.sdf
  complex_pdb: test/data/6xj3_pdb_test/6xj3.pdb
  ligand_pdb: test/data/6xj3_pdb_test/ligand.pdb
  trajectory: test/data/6xj3_pdb_test/6xj3.xtc
output_settings:
  output_directory: mmgbsa_results/complex2_analysis_final
  analysis_name: complex2_gbn2
  save_plots: true
  save_logs: true
analysis_settings:
  temperature: 300.0
  gb_model: GBn2
  salt_concentration: 0.15
  max_frames: 100
  frame_stride: 100
  frame_selection: sequential
  use_cache: true
  charge_method: gasteiger
  run_per_residue_decomposition: true
  decomp_frames: 10
  parallel_processing: true
platform_settings:
  decomposition_platform: CPU
  preferred_platform: CUDA
