input_files:
  ligand_mol: test/data/3if6_dimer_test/ligand.sdf
  complex_pdb: test/data/3if6_dimer_test/3if6.tpr
  trajectory: test/data/3if6_dimer_test/3if6.xtc
  ligand_resname: LIG
analysis_settings:
  temperature: 310.0
  gb_model: OBC2
  salt_concentration: 0.15
  max_frames: 25
  verbose: 2
  use_cache: true
  parallel_processing: true
  energy_decomposition: true
  run_entropy_analysis: true
  run_per_residue_decomposition: true
  decomp_frames: 10
output_settings:
  output_directory: mmgbsa_results
  save_plots: true
  save_trajectories: false
  save_intermediate: true
  output_format: csv
advanced_settings:
  minimization_tolerance: 1e-6
  nma_quality_threshold: Good
  hot_spot_threshold: -1.0
  bootstrap_confidence: 0.95
  bootstrap_samples: 100
  convergence_window: 10
  ligand_forcefield: openff-2.1.0.offxml
  protein_forcefield: amber14-all.xml
platform_settings:
  preferred_platform: OpenCL
  cuda_device: 0
  cuda_precision: double
  deterministic_forces: true
  decomposition_platform: CPU
validation_settings:
  validate_inputs: true
  validate_results: true
  max_std_dev: 10.0
  min_successful_frames: 10
  check_convergence: true
  generate_validation_report: true
