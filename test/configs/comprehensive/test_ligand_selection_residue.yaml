# Test custom ligand selection (residue pattern)
# Tests filtering ligand by residue properties/names

analysis_settings:
  decomp_frames: 1
  entropy_method: none
  frame_selection: sequential
  frame_stride: 1
  gb_model: GBn
  max_frames: 1
  report_raw_energies: false
  run_entropy_analysis: false
  run_per_residue_decomposition: true
  sa_model: ACE
  salt_concentration: 0.15
  temperature: 300.0
  use_cache: false
  verbose: 1

  # Protein selection: keep full receptor atom map for topology consistency
  receptor_selection: "protein"
  # Custom ligand: by residue name pattern
  ligand_selection: "resname LIG"

forcefield_settings:
  protein_forcefield: amber

input_files:
  complex_pdb: test/data/6t1h_1151_comp/complex.prmtop
  trajectory: test/data/6t1h_1151_comp/md_complex_prod.xtc
  solvated_topology: test/data/6t1h_1151_comp/replica_1/gro/complex_solv_ions.gro

output_settings:
  analysis_name: test_ligand_selection_residue
  output_directory: test/results/comprehensive/test_ligand_selection_residue
  save_logs: true
  save_plots: false
